name: APK bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: for f in *.zip; do unzip -oq "$f"; done
      - run: gradle :app:assembleRelease --no-daemon
        working-directory: Buzzer-Android
      - run: cp Buzzer-Android/app/build/outputs/apk/release/app-release.apk Buzzer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: Buzzer.apk
